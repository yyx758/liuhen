<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef1f6" />
    <title>小记 · 留痕</title>
    <style>
      :root{color-scheme:light;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#14213d;background:#eef1f6}
      *{box-sizing:border-box}body{min-height:100vh;margin:0;display:flex;flex-direction:column}
      header,main,footer{width:min(100% - 40px,1100px);margin-inline:auto}
      header{padding:30px 0;border-bottom:1px solid #ccd4e3;font-size:24px;font-weight:750;letter-spacing:-.05em}
      .mark{display:inline-grid;place-items:center;width:23px;height:23px;margin-right:9px;border-radius:6px;background:#ffe066;font-size:17px;vertical-align:2px;letter-spacing:0}
      main{flex:1;display:grid;align-content:center;justify-items:start;padding:70px 0 100px}
      .eyebrow{font-size:13px;letter-spacing:.14em;color:#65718a;font-weight:650}
      h1{max-width:660px;margin:20px 0 16px;font-size:clamp(42px,7vw,76px);line-height:1.15;letter-spacing:-.065em}
      p{max-width:560px;margin:0;color:#65718a;font-size:17px;line-height:1.85}
      .enter{display:inline-block;margin-top:34px;padding:14px 21px;border-radius:8px;background:#2d4be0;color:#fff;text-decoration:none;font-size:15px;font-weight:650;box-shadow:0 10px 24px #2d4be033}
      .enter:hover{background:#213cc9}.enter:focus-visible,a:focus-visible{outline:3px solid #8da3ff;outline-offset:3px}
      footer{border-top:1px solid #ccd4e3;padding:23px 0 28px;text-align:center;font-size:12px;color:#65718a}
      footer a{color:inherit;text-decoration:none}footer a:hover{text-decoration:underline;color:#2d4be0}
    </style>
  </head>
  <body>
    <header><span class="mark" aria-hidden="true">✳</span>小记<span style="color:#2d4be0">.</span></header>
    <main>
      <div class="eyebrow">LIUHEN · PERSONAL SPACE</div>
      <h1>把想法，放进日程。</h1>
      <p>留痕是个人任务管理空间。用自然语言安排待办，记录每一次需要确认的修改。</p>
      <a class="enter" href="/app/">登录并进入小记 →</a>
    </main>
    <footer><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">赣ICP备2026013160号-1</a></footer>
  </body>
</html>
