name: liuhen

services:
  db:
    image: postgres:17.12-alpine
    env_file:
      - ./secrets/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: liuhen-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ./secrets/model.env
      - ./secrets/postgres.env
      - ./secrets/smtp.env
    environment:
      LIUHEN_DATABASE_HOST: db
      LIUHEN_SQL_ECHO: "false"
      # 只接受来自本站页面的写请求（Origin 校验）。
      LIUHEN_ALLOWED_ORIGINS: https://liuhen.yyyyx.top
      # 线上经 HTTPS 访问，会话 Cookie 必须带 Secure。
      LIUHEN_COOKIE_SECURE: "true"
      # 普通用户每日对话轮数默认上限（管理员不限）。
      LIUHEN_DEFAULT_DAILY_CHAT_LIMIT: "50"
      # API 只在 Compose 内部网络可达，信任 Caddy 传来的 X-Forwarded-For，限流才能按真实 IP 计算。
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)"]
      interval: 30s
      timeout: 7s
      retries: 3

  web:
    image: liuhen-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
