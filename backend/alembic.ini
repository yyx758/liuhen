# Alembic config. Run from the project root: alembic -c backend/alembic.ini upgrade head
# Keep this file ASCII-only: configparser uses the locale encoding (GBK on Chinese Windows).
# The database URL is read by migrations/env.py from .env / environment, same as the app.
[alembic]
script_location = %(here)s/migrations
# Run from the project root so that "import backend" works in env.py.
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
