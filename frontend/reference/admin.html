<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>小记 — 账号管理（原型）</title>
<!--
  管理员页面交互原型：纯前端模拟数据，不连接后端。
  对应 docs/prd-multi-user.md 5.6 / 10.4 节；视觉沿用 index.html 的设计变量。
-->
<style>
:root{--bg:#eef1f6;--ink:#14213d;--sub:#65718a;--line:#ccd4e3;--line-soft:#dfe5ee;--blue:#2d4be0;--blue-soft:#e6ebff;--yellow:#ffe066;--surface:#f8faff;--white:#fff;--red:#c44955;--green:#26816e;--shadow:0 18px 50px rgba(20,33,61,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}svg{display:block;flex:none}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8da3ff;outline-offset:3px}::selection{background:#cdd7ff}
.shell{max-width:1376px;margin:0 auto;padding:0 54px 76px}
.topbar{height:86px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:26px;letter-spacing:-1.6px;white-space:nowrap}.brand-mark{width:20px;height:20px;display:inline-grid;place-items:center;background:var(--yellow);border-radius:5px;transform:rotate(-9deg)}.brand-mark svg{transform:rotate(9deg)}
.nav{margin:auto;display:flex;align-items:center;gap:28px;height:100%}.nav button{padding:31px 2px 28px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--sub);font-size:14px;white-space:nowrap;transition:.2s}.nav button:hover,.nav button.active{color:var(--ink)}.nav button.active{border-color:var(--blue);font-weight:650}.nav .count{font-size:10px;background:var(--yellow);padding:2px 5px;border-radius:99px;color:var(--ink);margin-left:3px}.nav .sep{width:1px;height:18px;background:var(--line)}
.top-actions{display:flex;gap:13px;align-items:center;position:relative}.avatar-btn{border:0;background:transparent;padding:0;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px}.avatar{width:34px;height:34px;background:var(--ink);color:#fff;border-radius:50%;font-size:12px;font-weight:700;display:grid;place-items:center}
.menu{position:absolute;right:0;top:46px;background:#f9fbff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);min-width:190px;padding:6px;z-index:20}.menu .who{padding:10px 11px 9px;border-bottom:1px solid var(--line-soft);margin-bottom:5px;font-size:12px;color:var(--sub)}.menu .who b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:6px;font-size:13px;color:var(--ink)}.menu button:hover{background:#e5eaf5}
.icon{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.page{animation:rise .28s ease both}@keyframes rise{from{opacity:.65;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.page-kicker{display:flex;align-items:center;gap:9px;color:var(--sub);font-size:13px;letter-spacing:.08em}.dot{height:6px;width:6px;display:inline-block;border-radius:50%;background:var(--blue)}.page-title{font-weight:730;font-size:40px;line-height:1.22;letter-spacing:-1.7px;margin:11px 0}.lead{color:var(--sub);font-size:15px;line-height:1.8;margin:0}
.tiny{font-size:12px;color:var(--sub)}.small{font-size:13px;color:var(--sub)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:5px;background:#e4e9f1;color:#54617a;font-size:11px;line-height:1.2;white-space:nowrap}.tag.yellow{background:var(--yellow);color:#6b5310}.tag.red{background:#fbe7e9;color:#a83846}.tag.blue{background:var(--blue-soft);color:var(--blue)}.tag.green{background:#dff2ec;color:#247d68}.tag.ghost{background:transparent;border:1px solid var(--line)}.pill-dot{width:6px;height:6px;background:currentColor;border-radius:100%}
.solid,.outline,.text-btn{border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;font-size:13px;font-weight:650;min-height:34px;transition:.18s;white-space:nowrap}.solid{color:#fff;background:var(--blue);border:1px solid var(--blue)}.solid:hover{background:#213cc9}.solid.red{background:var(--red);border-color:var(--red)}.solid.red:hover{background:#a83846}.outline{color:var(--ink);background:transparent;border:1px solid var(--line)}.outline:hover{background:#e5eaf5}.text-btn{color:var(--sub);background:transparent;border:1px solid transparent}.text-btn:hover{color:var(--ink);background:#e5eaf5}.danger{color:var(--red)!important}.danger-outline{border-color:#ecc1c6;color:var(--red)}.danger-outline:hover{background:#fbe7e9}
.square-btn{height:34px;width:34px;display:grid;place-items:center;border:1px solid var(--line);background:transparent;border-radius:7px;color:var(--ink)}.square-btn:hover{background:#e2e8f4}
.spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.field{width:100%;background:white;border:1px solid #d5deeb;padding:11px 13px;border-radius:6px;color:var(--ink);outline:0;font-size:13px}.field:focus{border-color:var(--blue)}textarea.field{min-height:84px;resize:vertical;line-height:1.7}
label.lbl{display:block;font-size:12px;color:var(--sub);margin:0 0 7px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:20px 0 14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:transparent;color:var(--sub);padding:7px 12px;border-radius:99px;font-size:13px;display:inline-flex;gap:6px;align-items:center}.tabs button:hover{color:var(--ink);background:#e5eaf5}.tabs button.active{background:var(--ink);border-color:var(--ink);color:#fff}.tabs .n{font-size:11px;opacity:.75}.tabs button.active .n{opacity:.85}.tabs .badge{font-size:10px;background:var(--yellow);color:var(--ink);padding:1px 6px;border-radius:99px;font-weight:700}
.search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ink);padding:4px 0 7px;min-width:260px;color:var(--sub)}.search input{border:0;background:transparent;outline:0!important;flex:1;font-size:14px;color:var(--ink)}.search kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--sub);font-family:inherit}

/* list */
.list{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(220px,2.1fr) 110px minmax(150px,1.3fr) minmax(140px,1.2fr) 80px minmax(200px,auto);gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-soft);transition:background .15s}.row:last-child{border-bottom:0}
.row.head{background:transparent;font-size:11px;color:var(--sub);letter-spacing:.06em;padding-top:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.row.item{cursor:pointer}.row.item:hover{background:#eef2fb}.row.item.flash{animation:flash 1.1s ease}@keyframes flash{0%{background:#fff5c2}100%{background:transparent}}
.row.leaving{animation:leave .32s ease forwards}@keyframes leave{to{opacity:0;transform:translateX(18px)}}
.acct{display:flex;gap:11px;align-items:center;min-width:0}.acct .av{width:34px;height:34px;border-radius:50%;background:#dfe5f1;color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}.acct .av.admin{background:var(--ink);color:#fff}.acct .nm{font-weight:650;font-size:14px;display:flex;gap:6px;align-items:center}.acct .em{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct>div{min-width:0}
.when{font-size:12px;color:var(--sub);line-height:1.7}.when b{color:var(--ink);font-weight:550}
.usage .t{font-size:12px;display:flex;justify-content:space-between;margin-bottom:6px}.usage .t b{font-weight:650}.bar{height:5px;background:#dfe5ee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}.bar i.warn{background:#d79a1c}.bar i.full{background:var(--red)}
.ops{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.empty{padding:56px 20px;text-align:center;color:var(--sub);font-size:14px}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* events */
.events{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px}
.ev{display:grid;grid-template-columns:132px 130px 1fr auto;gap:16px;padding:13px 18px;border-bottom:1px solid var(--line-soft);font-size:13px;align-items:center}.ev:last-child{border-bottom:0}.ev .tm{color:var(--sub);font-size:12px}.ev .who{color:var(--sub);font-size:12px}
.timeline{border-left:1px solid var(--line);margin-left:5px;padding-left:18px}.tl{position:relative;padding:0 0 16px}.tl::before{content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--blue)}.tl .a{font-size:13px;font-weight:600}.tl .b{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.6}

/* drawer & modal */
.drawer-overlay{position:fixed;inset:0;background:rgba(11,23,50,.23);z-index:24;display:flex;justify-content:flex-end}.drawer-overlay.anim{animation:fade .18s ease}@keyframes fade{from{opacity:0}}
.drawer{width:min(520px,100%);height:100vh;background:#f9fbff;padding:28px 34px;overflow:auto;box-shadow:-20px 0 60px rgba(17,32,67,.12);display:flex;flex-direction:column}@keyframes slide{from{transform:translateX(30px);opacity:.6}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.drawer h2{font-size:30px;letter-spacing:-1px;margin:6px 0 10px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px 14px;font-size:13px;margin:20px 0 4px}.kv dt{color:var(--sub)}.kv dd{margin:0}
.dsec{margin-top:26px}.dsec h3{font-size:14px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.week{display:flex;gap:8px;align-items:end;height:92px;padding:0 2px}.week .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:end}.week .c i{display:block;width:100%;max-width:30px;background:var(--blue-soft);border-radius:4px 4px 2px 2px;min-height:2px}.week .c.today i{background:var(--blue)}.week .c span{font-size:10px;color:var(--sub)}.week .c em{font-style:normal;font-size:10px;color:var(--ink)}
.drawer-actions{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.note{background:#fff8d6;border-radius:7px;padding:11px 13px;font-size:12px;line-height:1.7;color:#6b5310;margin-top:14px}
.note.red{background:#fbe7e9;color:#a83846}
.overlay{position:fixed;inset:0;background:rgba(13,25,50,.34);z-index:30;display:flex;justify-content:center;align-items:center;padding:22px;backdrop-filter:blur(3px)}.overlay.anim{animation:fade .15s ease}.drawer-overlay.anim .drawer{animation:slide .22s ease}.overlay.anim .modal{animation:pop .18s ease}
.modal{width:min(480px,100%);background:#f9fbff;border-radius:11px;box-shadow:0 28px 80px rgba(9,23,55,.22);padding:26px 28px 24px}@keyframes pop{from{transform:scale(.97);opacity:.6}}
.modal h2{font-size:22px;letter-spacing:-.6px;margin:0}.modal .desc{font-size:13px;color:var(--sub);margin:8px 0 20px;line-height:1.7}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;border-top:1px solid var(--line);padding-top:17px}
.pw{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:8px;padding:14px 16px;font-family:ui-monospace,Consolas,monospace;font-size:17px;letter-spacing:.06em}.pw span{flex:1;word-break:break-all}.pw button{border:0;background:var(--yellow);color:var(--ink);border-radius:6px;padding:6px 11px;font-size:12px;font-weight:700;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 11px;font-size:12px;color:var(--sub)}.chips button:hover{background:#e5eaf5;color:var(--ink)}.chips button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.radio{display:flex;gap:10px;align-items:center;font-size:13px;padding:9px 0}.radio input{accent-color:var(--blue);width:16px;height:16px}
.toast{position:fixed;right:27px;bottom:28px;z-index:50;background:var(--ink);color:#fff;min-width:250px;max-width:min(420px,calc(100vw - 36px));padding:13px 15px;border-radius:8px;display:flex;justify-content:space-between;gap:18px;align-items:center;box-shadow:0 12px 35px rgba(15,29,58,.2);font-size:13px;animation:rise .2s ease}.toast button{border:0;background:transparent;color:var(--yellow);font-size:12px;font-weight:700}
.proto{position:fixed;left:16px;bottom:16px;z-index:40;font-size:11px;color:var(--sub);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:7px;padding:7px 10px;display:flex;gap:10px;align-items:center}.proto label{display:flex;gap:5px;align-items:center;cursor:pointer}.proto button{border:0;background:transparent;color:var(--blue);font-size:11px;padding:0}

@media (max-width:1080px){.row{grid-template-columns:minmax(200px,2fr) 100px minmax(130px,1.2fr) 70px minmax(170px,auto)}.row .c-when2{display:none}}
@media (max-width:820px){.shell{padding:0 18px 70px}.nav{display:none}.admin-hero{flex-direction:column;align-items:start}.stats{grid-template-columns:repeat(2,1fr)}.row.head{display:none}.row{grid-template-columns:1fr auto;gap:10px}.row .c-status,.row .c-when,.row .c-week{display:none}.row .c-usage{grid-column:1/-1;order:3}.ev{grid-template-columns:1fr;gap:4px}.drawer{padding:22px 20px}}
</style>

<div id="app"></div>
<script>
// ---------------- 模拟数据 ----------------
const NOW = new Date('2026-11-21T15:30:00+08:00').getTime();
const H = 3600e3, D = 24 * H;
const DEFAULT_LIMIT = 50;
const SELF_ID = 1;
let seq = 100;

const users = [
  { id: 1, username: 'admin', email: 'admin@example.com', role: 'admin', status: 'active', created: NOW - 92 * D, lastLogin: NOW - 6 * 60e3, limit: null, week: [31, 44, 12, 67, 58, 23, 72], mustChange: false },
  { id: 2, username: 'lin_xiaoyu', email: 'xiaoyu@example.com', role: 'user', status: 'pending', created: NOW - 2.4 * H, lastLogin: null, limit: null, week: [0, 0, 0, 0, 0, 0, 0] },
  { id: 3, username: 'zhoumo', email: null, role: 'user', status: 'pending', created: NOW - 19 * H, lastLogin: null, limit: null, week: [0, 0, 0, 0, 0, 0, 0] },

  { id: 5, username: 'wang_jing', email: 'wangjing@example.com', role: 'user', status: 'active', created: NOW - 41 * D, lastLogin: NOW - 35 * 60e3, limit: null, week: [12, 18, 9, 22, 30, 14, 47] },
  { id: 6, username: 'sun_he', email: 'sunhe@example.com', role: 'user', status: 'active', created: NOW - 30 * D, lastLogin: NOW - 3 * H, limit: 100, week: [40, 56, 61, 38, 72, 88, 64] },
  { id: 7, username: 'li_tong', email: null, role: 'user', status: 'active', created: NOW - 26 * D, lastLogin: NOW - 1.5 * D, limit: null, week: [5, 0, 8, 3, 11, 0, 0] },
  { id: 8, username: 'gao_yan', email: 'gaoyan@example.com', role: 'user', status: 'active', created: NOW - 17 * D, lastLogin: NOW - 20 * 60e3, limit: null, week: [22, 35, 41, 50, 49, 50, 50] },
  { id: 9, username: 'he_qing', email: 'heqing@example.com', role: 'user', status: 'active', created: NOW - 9 * D, lastLogin: NOW - 5 * D, limit: 20, week: [3, 6, 0, 0, 0, 0, 0], mustChange: true },
  { id: 10, username: 'test_bot', email: null, role: 'user', status: 'disabled', created: NOW - 22 * D, lastLogin: NOW - 8 * D, limit: null, week: [0, 0, 0, 0, 0, 0, 0], reason: '短时间内大量调用对话，疑似脚本' },
  { id: 11, username: 'spam_2026', email: 'x@spam.example', role: 'user', status: 'rejected', created: NOW - 6 * D, lastLogin: null, limit: null, week: [0, 0, 0, 0, 0, 0, 0], reason: '不认识的注册申请' },
  { id: 12, username: 'xu_ming', email: 'xuming@example.com', role: 'user', status: 'active', created: NOW - 4 * D, lastLogin: NOW - 26 * H, limit: null, week: [0, 0, 0, 7, 15, 9, 2] },
];

const events = [];
function ev(type, targetId, actorId, at, extra = {}) { events.push({ id: ++seq, type, targetId, actorId, at, ...extra }); }
ev('user_registered', 4, 4, NOW - 2.2 * D, { ip: '115.22.8.4' });
ev('user_registered', 3, 3, NOW - 19 * H, { ip: '36.110.4.71' });

ev('user_registered', 11, 11, NOW - 6 * D, { ip: '45.12.9.200' });
ev('user_rejected', 11, 1, NOW - 5.8 * D, { reason: '不认识的注册申请' });
ev('user_disabled', 10, 1, NOW - 8 * D, { reason: '短时间内大量调用对话，疑似脚本' });
ev('password_reset', 9, 1, NOW - 5 * D);
ev('chat_limit_changed', 9, 1, NOW - 5 * D, { detail: '默认(50) → 20' });
ev('chat_limit_changed', 6, 1, NOW - 12 * D, { detail: '默认(50) → 100' });
ev('user_approved', 12, 1, NOW - 4 * D + 2 * H);
ev('login_failed', 7, 7, NOW - 1.6 * D, { ip: '182.50.1.9' });
ev('login_succeeded', 7, 7, NOW - 1.5 * D, { ip: '182.50.1.9' });
ev('login_succeeded', 8, 8, NOW - 20 * 60e3, { ip: '117.136.2.31' });
ev('login_succeeded', 1, 1, NOW - 6 * 60e3, { ip: '112.96.4.20' });

const EV_LABEL = {
  user_registered: '提交注册', user_approved: '审核通过', user_rejected: '拒绝注册', user_disabled: '停用账号', user_enabled: '启用账号',
  user_deleted: '删除账号', password_reset: '重置密码', password_changed: '修改密码', chat_limit_changed: '调整对话上限',
  login_succeeded: '登录成功', login_failed: '登录失败', login_locked: '登录锁定',
};
const EV_TAG = { user_approved: 'green', user_enabled: 'green', user_rejected: 'red', user_disabled: 'red', user_deleted: 'red', login_failed: 'red', password_reset: 'yellow', chat_limit_changed: 'blue' };
const STATUS = { pending: ['待审核', 'yellow'], active: ['正常', 'green'], disabled: ['已停用', 'red'], rejected: ['已拒绝', ''] };

// ---------------- 界面状态 ----------------
const UI = { section: 'users', tab: 'pending', q: '', drawer: null, modal: null, toast: null, menu: false, busy: null, flash: null, leaving: null, slow: true, evFilter: 'all' };

// ---------------- 工具函数 ----------------
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = id => users.find(u => u.id === id);
const nameOf = id => id == null ? 'CLI' : (byId(id)?.username ?? `#${id}`);
const today = u => u.week[6];
const weekSum = u => u.week.reduce((a, b) => a + b, 0);
const limitOf = u => u.role === 'admin' ? Infinity : (u.limit ?? DEFAULT_LIMIT);
const pendingCount = () => users.filter(u => u.status === 'pending').length;
function ago(t) {
  if (t == null) return '从未';
  const d = NOW - t;
  if (d < 60 * 60e3) return `${Math.max(1, Math.round(d / 60e3))} 分钟前`;
  if (d < D) return `${Math.round(d / H)} 小时前`;
  if (d < 7 * D) return `${Math.round(d / D)} 天前`;
  const x = new Date(t); return `${x.getMonth() + 1}月${x.getDate()}日`;
}
function stamp(t) { const x = new Date(t); const p = n => String(n).padStart(2, '0'); return `${x.getMonth() + 1}-${p(x.getDate())} ${p(x.getHours())}:${p(x.getMinutes())}`; }
function waitText(t) { const d = NOW - t; return d < D ? `已等待 ${Math.max(1, Math.round(d / H))} 小时` : `已等待 ${Math.round(d / D)} 天`; }
const I = {
  spark: '<svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',
  search: '<svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  x: '<svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  check: '<svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="m5 12 5 5L20 7"/></svg>',
  more: '<svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
  down: '<svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="m6 9 6 6 6-6"/></svg>',
};

// ---------------- 渲染 ----------------
function topbar() {
  const nav = ['首页', '对话', '日历', '待办', '资料库', '留痕'].map(n => `<button type="button" data-action="fake-nav" data-name="${n}">${n}</button>`).join('');
  const pc = pendingCount();
  return `<header class="topbar">
    <div class="brand"><span class="brand-mark">${I.spark}</span>小记<span style="color:var(--blue)">.</span></div>
    <nav class="nav" aria-label="主导航">${nav}<span class="sep"></span><button type="button" class="active">管理${pc ? `<span class="count" title="待审核账号">${pc}</span>` : ''}</button></nav>
    <div class="top-actions">
      <button class="avatar-btn" type="button" data-action="menu" aria-haspopup="menu" aria-expanded="${UI.menu}"><span class="avatar">管</span>${I.down}</button>
      ${UI.menu ? `<div class="menu" role="menu"><div class="who"><b>admin</b>管理员 · 对话不限量</div><button type="button" data-action="fake-nav" data-name="个人设置">个人设置</button><button type="button" data-action="fake-nav" data-name="退出登录">退出登录</button></div>` : ''}
    </div>
  </header>`;
}

function hero() {
  const active = users.filter(u => u.status === 'active');
  const todaySum = active.reduce((a, u) => a + today(u), 0);
  const weekAll = active.reduce((a, u) => a + weekSum(u), 0);
  const pc = pendingCount();
  return `<section class="admin-hero">
    <div><div class="page-kicker"><span class="dot"></span>管理 · 仅管理员可见</div>
      <h1 class="page-title">账号管理</h1>
      <p class="lead">审核注册、停用账号、重置密码和调整每日对话上限。你看不到其他人的待办和对话内容。</p></div>
  </section>
  <div class="stats">
    <button type="button" class="stat ${pc ? 'hl' : ''}" data-action="jump" data-tab="pending"><div class="tiny">待审核</div><div class="num">${pc}<small>个</small></div></button>
    <button type="button" class="stat" data-action="jump" data-tab="active"><div class="tiny">正常账号</div><div class="num">${active.length}<small>个</small></div></button>
    <div class="stat"><div class="tiny">今日对话（全部用户）</div><div class="num">${todaySum}<small>轮</small></div></div>
    <div class="stat"><div class="tiny">近 7 天对话</div><div class="num">${weekAll}<small>轮</small></div></div>
  </div>`;
}

function filtered() {
  const q = UI.q.trim().toLowerCase();
  return users.filter(u => (UI.tab === 'all' || u.status === UI.tab) && (!q || u.username.includes(q) || (u.email || '').includes(q)))
    .sort((a, b) => UI.tab === 'pending' ? a.created - b.created : (a.id === SELF_ID ? -1 : b.id === SELF_ID ? 1 : (b.lastLogin ?? 0) - (a.lastLogin ?? 0)));
}

function usageCell(u) {
  const lim = limitOf(u), t = today(u);
  if (u.status === 'pending' || u.status === 'rejected') return '<span class="tiny">—</span>';
  if (lim === Infinity) return `<div class="usage"><div class="t"><b>${t} 轮</b><span class="tiny">不限</span></div><div class="bar"><i style="width:0"></i></div></div>`;
  const pct = Math.min(100, t / lim * 100);
  return `<div class="usage"><div class="t"><b>${t} / ${lim}</b><span class="tiny">${u.limit == null ? '默认' : '自定义'}</span></div><div class="bar"><i class="${pct >= 100 ? 'full' : pct >= 80 ? 'warn' : ''}" style="width:${pct}%"></i></div></div>`;
}

function btn(action, id, label, cls = 'outline') {
  const busy = UI.busy === `${action}:${id}`;
  return `<button type="button" class="${cls}" data-action="${action}" data-id="${id}" ${UI.busy ? 'disabled' : ''}>${busy ? '<span class="spin"></span>' : ''}${label}</button>`;
}

function opsCell(u) {
  if (u.id === SELF_ID) return `<span class="tiny">这是你</span>`;
  switch (u.status) {
    case 'pending': return btn('reject', u.id, '拒绝', 'outline danger-outline') + btn('approve', u.id, `${I.check}通过`, 'solid');
    case 'active': return btn('reset', u.id, '重置密码', 'text-btn') + btn('limit', u.id, '调整上限', 'text-btn') + btn('disable', u.id, '停用', 'outline danger-outline');
    case 'disabled': return btn('reset', u.id, '重置密码', 'text-btn') + btn('enable', u.id, '启用', 'outline');
    case 'rejected': return btn('delete', u.id, '删除', 'outline danger-outline');
  }
}

function userRow(u) {
  const [sl, sc] = STATUS[u.status];
  const cls = ['row', 'item', UI.flash === u.id ? 'flash' : '', UI.leaving === u.id ? 'leaving' : ''].join(' ');
  const when = u.status === 'pending'
    ? `<b>${ago(u.created)}</b>注册<br>${waitText(u.created)}`
    : `最近登录 <b>${ago(u.lastLogin)}</b><br>注册于 ${ago(u.created)}`;
  return `<div class="${cls}" data-action="open" data-id="${u.id}" tabindex="0" role="button" aria-label="查看 ${h(u.username)}">
    <div class="acct"><span class="av ${u.role === 'admin' ? 'admin' : ''}">${h(u.username[0].toUpperCase())}</span><div>
      <div class="nm">${h(u.username)}${u.role === 'admin' ? '<span class="tag blue">管理员</span>' : ''}${u.mustChange ? '<span class="tag yellow" title="管理员已重置密码，等待用户修改">待改密</span>' : ''}</div>
      <div class="em">${u.email ? h(u.email) : '未填写邮箱'}</div></div></div>
    <div class="c-status"><span class="tag ${sc}"><span class="pill-dot"></span>${sl}</span></div>
    <div class="when c-when">${when}</div>
    <div class="c-usage">${usageCell(u)}</div>
    <div class="c-week c-when2"><span class="small">${u.status === 'pending' || u.status === 'rejected' ? '—' : weekSum(u) + ' 轮'}</span></div>
    <div class="ops">${opsCell(u)}</div>
  </div>`;
}

function usersSection() {
  const counts = s => users.filter(u => s === 'all' || u.status === s).length;
  const tabs = [['pending', '待审核'], ['active', '正常'], ['disabled', '已停用'], ['rejected', '已拒绝'], ['all', '全部']].map(([k, l]) =>
    `<button type="button" class="${UI.tab === k ? 'active' : ''}" data-action="tab" data-tab="${k}">${l}${k === 'pending' && counts(k) ? `<span class="badge">${counts(k)}</span>` : `<span class="n">${counts(k)}</span>`}</button>`).join('');
  const list = filtered();
  const emptyText = UI.q ? ['没有匹配的账号', `换个关键词试试，当前搜索：“${h(UI.q)}”`]
    : UI.tab === 'pending' ? ['没有待审核的注册', '新用户提交注册后会出现在这里，导航上的角标也会提示。'] : ['这里还没有账号', ''];
  return `<div class="toolbar"><div class="tabs" role="tablist">${tabs}</div>
    <label class="search">${I.search}<input data-input="q" value="${h(UI.q)}" placeholder="搜索用户名或邮箱" aria-label="搜索账号" /><kbd>/</kbd></label></div>
    <div class="list">
      <div class="row head"><div>账号</div><div class="c-status">状态</div><div class="c-when">${UI.tab === 'pending' ? '注册' : '活动'}</div><div class="c-usage">今日对话</div><div class="c-week c-when2">近 7 天</div><div style="text-align:right">操作</div></div>
      ${list.length ? list.map(userRow).join('') : `<div class="empty"><b>${emptyText[0]}</b>${emptyText[1]}</div>`}
    </div>`;
}

function eventsSection() {
  const groups = { all: '全部', review: '审核', account: '账号变更', login: '登录' };
  const match = e => UI.evFilter === 'all'
    || (UI.evFilter === 'review' && /registered|approved|rejected/.test(e.type))
    || (UI.evFilter === 'account' && /disabled|enabled|deleted|password|limit/.test(e.type))
    || (UI.evFilter === 'login' && e.type.startsWith('login'));
  const list = [...events].filter(match).sort((a, b) => b.at - a.at);
  return `<div class="toolbar"><div class="tabs">${Object.entries(groups).map(([k, l]) => `<button type="button" class="${UI.evFilter === k ? 'active' : ''}" data-action="evf" data-f="${k}">${l}</button>`).join('')}</div>
    <span class="tiny">账号事件只追加，不能修改或删除</span></div>
    <div class="events">${list.map(e => `<div class="ev">
      <span class="tm">${stamp(e.at)} · ${ago(e.at)}</span>
      <span><span class="tag ${EV_TAG[e.type] || ''}">${EV_LABEL[e.type]}</span></span>
      <span>${h(e.targetName || nameOf(e.targetId))}${e.reason ? `<span class="tiny">　原因：${h(e.reason)}</span>` : ''}${e.detail ? `<span class="tiny">　${h(e.detail)}</span>` : ''}</span>
      <span class="who">${e.actorId === e.targetId ? (e.ip ? `本人 · ${e.ip}` : '本人') : `操作人 ${h(nameOf(e.actorId))}`}</span>
    </div>`).join('') || '<div class="empty"><b>没有事件</b></div>'}</div>`;
}

function drawer() {
  const u = byId(UI.drawer); if (!u) return '';
  const [sl, sc] = STATUS[u.status];
  const days = ['一', '二', '三', '四', '五', '六', '日'];
  const lab = i => { const d = new Date(NOW - (6 - i) * D).getDay(); return i === 6 ? '今天' : '周' + days[(d + 6) % 7]; };
  const max = Math.max(...u.week, 1);
  const hasUsage = !['pending', 'rejected'].includes(u.status);
  const tl = events.filter(e => e.targetId === u.id).sort((a, b) => b.at - a.at).slice(0, 8);
  const lim = limitOf(u);
  return `<div class="drawer-overlay ${animDrawer ? 'anim' : ''}" data-action="close-drawer"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" data-stop>
    <div class="drawer-head"><span class="tiny">账号详情 / #${u.id}</span><button class="square-btn" type="button" data-action="close-drawer" aria-label="关闭">${I.x}</button></div>
    <div style="display:flex;gap:6px"><span class="tag ${sc}"><span class="pill-dot"></span>${sl}</span>${u.role === 'admin' ? '<span class="tag blue">管理员</span>' : '<span class="tag ghost">普通用户</span>'}${u.mustChange ? '<span class="tag yellow">待改密</span>' : ''}</div>
    <h2 id="dtitle">${h(u.username)}</h2>
    ${u.status === 'pending' ? `<div class="note">${waitText(u.created)}。通过后对方即可登录；拒绝后用户名仍被占用，可以再删除释放。</div>` : ''}
    ${u.reason && (u.status === 'disabled' || u.status === 'rejected') ? `<div class="note red">${u.status === 'disabled' ? '停用' : '拒绝'}原因：${h(u.reason)}</div>` : ''}
    <dl class="kv">
      <dt>邮箱</dt><dd>${u.email ? h(u.email) : '<span class="tiny">未填写</span>'}</dd>
      <dt>注册时间</dt><dd>${stamp(u.created)}（${ago(u.created)}）</dd>
      <dt>最近登录</dt><dd>${u.lastLogin ? `${stamp(u.lastLogin)}（${ago(u.lastLogin)}）` : '<span class="tiny">从未登录</span>'}</dd>
      <dt>每日上限</dt><dd>${lim === Infinity ? '不限（管理员）' : `${lim} 轮${u.limit == null ? '<span class="tiny">（默认）</span>' : '<span class="tiny">（自定义）</span>'}`}</dd>
    </dl>
    ${hasUsage ? `<div class="dsec"><h3>近 7 天对话 <span class="tiny">合计 ${weekSum(u)} 轮</span></h3>
      <div class="week">${u.week.map((n, i) => `<div class="c ${i === 6 ? 'today' : ''}"><em>${n || ''}</em><i style="height:${Math.max(2, n / max * 64)}px"></i><span>${lab(i)}</span></div>`).join('')}</div></div>` : ''}
    <div class="dsec"><h3>账号事件 <button class="text-btn" type="button" data-action="all-events" style="min-height:0;padding:3px 6px;font-size:12px">查看全部</button></h3>
      <div class="timeline">${tl.map(e => `<div class="tl"><div class="a">${EV_LABEL[e.type]}</div><div class="b">${stamp(e.at)} · ${e.actorId === e.targetId ? '本人' : '操作人 ' + h(nameOf(e.actorId))}${e.reason ? ' · ' + h(e.reason) : ''}${e.detail ? ' · ' + h(e.detail) : ''}${e.ip ? ' · ' + e.ip : ''}</div></div>`).join('') || '<div class="tiny">暂无</div>'}</div></div>
    <div class="dsec"><div class="tiny" style="line-height:1.7">管理员看不到该用户的待办、对话和操作留痕。</div></div>
    <div class="drawer-actions">${u.id === SELF_ID ? '<span class="tiny">不能在这里停用或重置自己的账号；修改密码请到个人设置。</span>' : opsCell(u)}</div>
  </section></div>`;
}

function modal() {
  const m = UI.modal; if (!m) return '';
  const u = byId(m.id);
  const busy = UI.busy === 'modal';
  const foot = (okLabel, okCls = 'solid', disabled = false) => `<div class="modal-actions"><button type="button" class="outline" data-action="close-modal">取消</button><button type="button" class="${okCls}" data-action="modal-ok" ${disabled || busy ? 'disabled' : ''}>${busy ? '<span class="spin"></span>' : ''}${okLabel}</button></div>`;
  let body = '';
  if (m.type === 'reject' || m.type === 'disable') {
    const isRej = m.type === 'reject';
    const quick = isRej ? ['不认识的注册申请', '信息不完整', '重复注册'] : ['疑似脚本或滥用', '本人要求停用', '长期不使用'];
    body = `<h2 id="mtitle">${isRej ? '拒绝注册' : '停用账号'}：${h(u.username)}</h2>
      <p class="desc">${isRej ? '拒绝后对方无法登录，登录时会看到“注册申请未通过”。用户名仍被占用，之后可以删除这条申请。' : '停用后对方所有已登录的设备会立即下线，数据保留，随时可以重新启用。'}</p>
      <label class="lbl" for="reason">原因（可选，会写入账号事件）</label>
      <textarea id="reason" class="field" data-input="reason" placeholder="写给以后的自己看">${h(m.reason || '')}</textarea>
      <div class="chips">${quick.map(q => `<button type="button" class="${m.reason === q ? 'on' : ''}" data-action="quick" data-v="${h(q)}">${q}</button>`).join('')}</div>
      ${foot(isRej ? '确认拒绝' : '确认停用', 'solid red')}`;
  } else if (m.type === 'reset') {
    if (!m.pw) {
      body = `<h2 id="mtitle">重置密码：${h(u.username)}</h2>
        <p class="desc">系统会生成一个临时密码，并让对方所有设备下线。对方用临时密码登录后必须先设置新密码。<br>临时密码只显示一次，请通过微信等方式私下告诉对方。</p>${foot('生成临时密码')}`;
    } else {
      body = `<h2 id="mtitle">临时密码已生成</h2>
        <p class="desc">把下面的密码告诉 <b>${h(u.username)}</b>。<b>关闭后无法再次查看</b>，忘记了只能重新重置。</p>
        <div class="pw"><span>${h(m.pw)}</span><button type="button" data-action="copy">${m.copied ? '已复制' : '复制'}</button></div>
        <div class="modal-actions"><button type="button" class="solid" data-action="close-modal">${m.copied ? '完成' : '我已记下'}</button></div>`;
    }
  } else if (m.type === 'limit') {
    const useDefault = m.useDefault;
    body = `<h2 id="mtitle">调整每日对话上限：${h(u.username)}</h2>
      <p class="desc">今天已用 ${today(u)} 轮，近 7 天合计 ${weekSum(u)} 轮。修改后立即生效，次日 0 点（UTC+8）重新计数。</p>
      <label class="radio"><input type="radio" name="lm" data-action="lm-default" ${useDefault ? 'checked' : ''}>使用默认值（${DEFAULT_LIMIT} 轮/天）</label>
      <label class="radio"><input type="radio" name="lm" data-action="lm-custom" ${!useDefault ? 'checked' : ''}>自定义</label>
      <div style="display:flex;gap:10px;align-items:center;padding-left:26px;${useDefault ? 'opacity:.45' : ''}">
        <input class="field" type="number" min="1" max="1000" style="width:120px" data-input="limit" value="${h(m.value)}" ${useDefault ? 'disabled' : ''} aria-label="每日上限"><span class="small">轮/天</span></div>
      <div class="chips" style="padding-left:26px">${[20, 50, 100, 200].map(n => `<button type="button" class="${!useDefault && +m.value === n ? 'on' : ''}" data-action="lm-quick" data-v="${n}" ${useDefault ? 'disabled' : ''}>${n}</button>`).join('')}</div>
      ${!useDefault && m.value !== '' && +m.value < today(u) ? `<div class="note">新上限低于今天已用的 ${today(u)} 轮，对方今天将无法继续对话。</div>` : ''}
      ${foot('保存', 'solid', !useDefault && !(+m.value >= 1 && +m.value <= 1000))}`;
  } else if (m.type === 'delete') {
    body = `<h2 id="mtitle">删除注册申请：${h(u.username)}</h2>
      <p class="desc">删除后用户名“${h(u.username)}”被释放，可以重新注册。这条申请没有任何业务数据；账号事件仍会保留。</p>
      <label class="lbl" for="confirm">输入用户名确认</label>
      <input id="confirm" class="field" data-input="confirm" value="${h(m.confirm || '')}" placeholder="${h(u.username)}" autocomplete="off">
      ${foot('删除', 'solid red', m.confirm !== u.username)}`;
  }
  return `<div class="overlay ${animModal ? 'anim' : ''}" data-action="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle" data-stop>${body}</section></div>`;
}

let firstPaint = true, lastDrawer = null, lastModal = null, animDrawer = false, animModal = false;
function render() {
  animDrawer = UI.drawer !== lastDrawer; lastDrawer = UI.drawer;
  animModal = UI.modal !== lastModal; lastModal = UI.modal;
  const active = document.activeElement;
  const keep = active?.dataset?.input ? { k: active.dataset.input, s: active.selectionStart, e: active.selectionEnd } : null;
  document.getElementById('app').innerHTML = `<div class="shell">${topbar()}<main class="${firstPaint ? 'page' : ''}">${hero()}
    <div class="subnav" role="tablist"><button type="button" class="${UI.section === 'users' ? 'active' : ''}" data-action="section" data-s="users">账号</button><button type="button" class="${UI.section === 'events' ? 'active' : ''}" data-action="section" data-s="events">账号事件</button></div>
    ${UI.section === 'users' ? usersSection() : eventsSection()}</main></div>
    ${drawer()}${modal()}
    ${UI.toast ? `<div class="toast" role="status"><span>${UI.toast}</span><button type="button" data-action="toast-x">知道了</button></div>` : ''}
    <div class="proto">交互原型 · 模拟数据<label><input type="checkbox" data-action="slow" ${UI.slow ? 'checked' : ''}>模拟网络延迟</label><button type="button" data-action="seed">再来一个注册</button></div>`;
  if (keep) {
    const el = document.querySelector(`[data-input="${keep.k}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (_) {} }
  }
  firstPaint = false;
}

// ---------------- 操作 ----------------
let toastTimer;
function toast(msg) { UI.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { UI.toast = null; render(); }, 3600); }
const delay = () => new Promise(r => setTimeout(r, UI.slow ? 420 + Math.random() * 300 : 0));

// 状态变更：模拟后端条件更新，结束后行从当前 Tab 淡出
async function transition(u, to, busyKey, extra = {}) {
  UI.busy = busyKey; render();
  await delay();
  UI.busy = null; UI.modal = null;
  const evType = { active: u.status === 'pending' ? 'user_approved' : 'user_enabled', rejected: 'user_rejected', disabled: 'user_disabled' }[to];
  const leavesTab = UI.tab !== 'all' && UI.tab !== to;
  if (leavesTab && !UI.drawer) { UI.leaving = u.id; render(); await new Promise(r => setTimeout(r, 300)); UI.leaving = null; }
  u.status = to; u.reason = extra.reason || null;
  ev(evType, u.id, SELF_ID, NOW, extra.reason ? { reason: extra.reason } : {});
  if (!leavesTab || UI.drawer) UI.flash = u.id;
}

async function handle(action, el) {
  const id = +el.dataset.id;
  const u = byId(id);
  switch (action) {
    case 'menu': UI.menu = !UI.menu; break;
    case 'fake-nav': UI.menu = false; toast(`原型中“${el.dataset.name}”不跳转。`); break;
    case 'section': UI.section = el.dataset.s; break;
    case 'tab': UI.tab = el.dataset.tab; break;
    case 'jump': UI.section = 'users'; UI.tab = el.dataset.tab; UI.q = ''; break;
    case 'evf': UI.evFilter = el.dataset.f; break;
    case 'open': UI.drawer = id; break;
    case 'close-drawer': UI.drawer = null; break;
    case 'all-events': UI.drawer = null; UI.section = 'events'; UI.evFilter = 'all'; break;
    case 'approve':
      await transition(u, 'active', `approve:${id}`);
      toast(`已通过 ${u.username}，对方现在可以登录了。`); break;
    case 'enable':
      await transition(u, 'active', `enable:${id}`);
      toast(`已启用 ${u.username}。`); break;
    case 'reject': case 'disable': UI.modal = { type: action, id, reason: '' }; break;
    case 'reset': UI.modal = { type: 'reset', id }; break;
    case 'limit': UI.modal = { type: 'limit', id, useDefault: u.limit == null, value: u.limit ?? DEFAULT_LIMIT }; break;
    case 'delete': UI.modal = { type: 'delete', id, confirm: '' }; break;
    case 'quick': UI.modal.reason = UI.modal.reason === el.dataset.v ? '' : el.dataset.v; break;
    case 'lm-default': UI.modal.useDefault = true; break;
    case 'lm-custom': UI.modal.useDefault = false; break;
    case 'lm-quick': UI.modal.value = el.dataset.v; break;
    case 'copy':
      try { await navigator.clipboard.writeText(UI.modal.pw); } catch (_) {}
      UI.modal.copied = true; break;
    case 'overlay': if (!UI.modal?.pw) UI.modal = null; break; // 临时密码弹窗不允许点空白处关闭，避免误关
    case 'close-modal':
      if (UI.modal?.pw && !UI.modal.copied && !confirm('还没有复制临时密码，关闭后无法再次查看。确定关闭？')) return;
      UI.modal = null; break;
    case 'modal-ok': await modalOk(); break;
    case 'toast-x': UI.toast = null; break;
    case 'slow': UI.slow = el.checked; break;
    case 'seed': {
      const names = ['zhao_lei', 'qian_duo', 'feng_yi', 'tang_xi', 'lu_an', 'mo_bai'];
      const n = names.find(x => !users.some(u => u.username === x)) || `user_${seq}`;
      const nu = { id: ++seq, username: n, email: Math.random() > .4 ? `${n.replace('_', '')}@example.com` : null, role: 'user', status: 'pending', created: NOW - 60e3, lastLogin: null, limit: null, week: [0, 0, 0, 0, 0, 0, 0] };
      users.push(nu); ev('user_registered', nu.id, nu.id, NOW - 60e3, { ip: '120.0.0.' + (seq % 250) });
      UI.flash = nu.id; toast(`新的注册申请：${n}（导航角标已更新）`); break;
    }
  }
  render();
  if (UI.flash) setTimeout(() => { UI.flash = null; }, 1200);
}

async function modalOk() {
  const m = UI.modal, u = byId(m.id);
  if (m.type === 'reject' || m.type === 'disable') {
    await transition(u, m.type === 'reject' ? 'rejected' : 'disabled', 'modal', { reason: m.reason.trim() });
    toast(m.type === 'reject' ? `已拒绝 ${u.username} 的注册申请。` : `已停用 ${u.username}，对方所有设备已下线。`);
  } else if (m.type === 'reset') {
    UI.busy = 'modal'; render(); await delay(); UI.busy = null;
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
    const buf = new Uint32Array(16); crypto.getRandomValues(buf);
    m.pw = Array.from(buf, x => chars[x % chars.length]).join('').replace(/(.{4})(?!$)/g, '$1-');
    u.mustChange = true; ev('password_reset', u.id, SELF_ID, NOW);
  } else if (m.type === 'limit') {
    UI.busy = 'modal'; render(); await delay(); UI.busy = null;
    const before = u.limit == null ? `默认(${DEFAULT_LIMIT})` : u.limit;
    u.limit = m.useDefault ? null : +m.value;
    const after = u.limit == null ? `默认(${DEFAULT_LIMIT})` : u.limit;
    if (String(before) !== String(after)) ev('chat_limit_changed', u.id, SELF_ID, NOW, { detail: `${before} → ${after}` });
    UI.modal = null; UI.flash = u.id; toast(`${u.username} 的每日上限已改为 ${u.limit ?? DEFAULT_LIMIT} 轮。`);
  } else if (m.type === 'delete') {
    UI.busy = 'modal'; render(); await delay(); UI.busy = null;
    users.splice(users.indexOf(u), 1);
    ev('user_deleted', u.id, SELF_ID, NOW, { targetName: u.username });
    UI.modal = null; UI.drawer = null; toast(`已删除 ${u.username}，用户名已释放。`);
  }
}

// ---------------- 事件委托 ----------------
document.addEventListener('click', e => {
  if (UI.menu && !e.target.closest('.top-actions')) { UI.menu = false; render(); }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  // 点在抽屉/弹窗内容里（非按钮处）时，closest 会找到外层遮罩，此时不应关闭
  if (el.matches('.overlay, .drawer-overlay') && e.target.closest('[data-stop]')) return;
  if (el.type !== 'radio' && el.type !== 'checkbox') e.preventDefault();
  handle(el.dataset.action, el);
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === 'q') UI.q = e.target.value;
  if (k === 'reason') { UI.modal.reason = e.target.value; return; }
  if (k === 'limit') UI.modal.value = e.target.value;
  if (k === 'confirm') UI.modal.confirm = e.target.value;
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (UI.modal) { handle(UI.modal.pw ? 'close-modal' : 'overlay', document.body); }
    else if (UI.drawer) { UI.drawer = null; render(); }
    else if (UI.menu) { UI.menu = false; render(); }
    return;
  }
  if (e.key === '/' && !e.target.dataset?.input && !UI.modal && UI.section === 'users') { e.preventDefault(); document.querySelector('[data-input="q"]')?.focus(); }
  if (e.key === 'Enter' && e.target.classList?.contains('item')) { handle('open', e.target); }
});
render();
</script>
</body>
