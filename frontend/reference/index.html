<script>
(function(){'use strict';
const KEY='xiaojii-demo-v4';
const weekNames=['周日','周一','周二','周三','周四','周五','周六'];
const catNames={job:'工作',study:'学习',life:'生活',other:'其他'};
const catColors={job:'#5b82e5',study:'#deb33d',life:'#49a581',other:'#9d89bf'};
const today=new Date();today.setHours(0,0,0,0);
const pad=n=>String(n).padStart(2,'0');
const localISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(date,n)=>{let d=new Date(date);d.setDate(d.getDate()+n);return d;};
const dateOf=s=>new Date(s+'T00:00:00');
const isoToday=localISO(today);
const h=(s)=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const I=(n,size=17)=>`<svg class="icon" style="width:${size}px;height:${size}px" viewBox="0 0 24 24"><use href="#i-${n}"/></svg>`;
function seed(){
 const td=(n)=>localISO(addDays(today,n));
 const tasks=[
 {id:'t1',title:'完成评测集第一版',date:td(0),time:'14:00',duration:90,category:'job',priority:'high',note:'完善 Agent 评测用例，跑出第一版基线，并记录主要问题。',status:'todo',ai:false,subtasks:[{title:'写 15 条常规用例',done:true},{title:'补 10 条模糊与多意图用例',done:false},{title:'完成判分脚本并跑出基线',done:false}]},
 {id:'t2',title:'读 Redis 持久化笔记',date:td(0),time:'16:30',duration:45,category:'study',priority:'medium',note:'复习 AOF、RDB 和混合持久化，整理面试回答。',status:'todo',ai:true,subtasks:[]},
 {id:'t3',title:'整理面试自我介绍',date:td(0),time:'20:00',duration:40,category:'job',priority:'medium',note:'控制在两分钟内，突出实习贡献和 Agent 项目。',status:'todo',ai:false,subtasks:[]},
 {id:'t4',title:'记录今天的复盘',date:td(0),time:'21:30',duration:30,category:'life',priority:'low',note:'写下今天完成的事情和明天最重要的一件事。',status:'done',ai:false,subtasks:[]},
 {id:'t5',title:'产品周会',date:td(1),time:'10:00',duration:60,category:'job',priority:'high',note:'同步迭代进展和风险。',status:'todo',ai:false,subtasks:[]},
 {id:'t6',title:'神经网络学习',date:td(1),time:'15:00',duration:60,category:'study',priority:'medium',note:'复习 Attention、LayerNorm、FFN。',status:'todo',ai:false,subtasks:[]},
 {id:'t7',title:'运动半小时',date:td(2),time:'19:00',duration:30,category:'life',priority:'low',note:'慢跑或者力量训练。',status:'todo',ai:false,subtasks:[]},
 {id:'t8',title:'录制 Agent 项目演示',date:td(3),time:'11:00',duration:90,category:'job',priority:'medium',note:'演示对话创建计划、工具调用和修改确认流程。',status:'todo',ai:true,subtasks:[]},
 {id:'t9',title:'整理知识库资料',date:td(-1),time:'19:00',duration:45,category:'study',priority:'low',note:'把最近的学习内容归档。',status:'done',ai:false,subtasks:[]}
 ];
 const pending=[
 {id:'p1',kind:'update',taskId:'t5',newDate:td(2),newTime:'15:00',label:'调整周会时间',source:'demo',status:'pending',createdAt:Date.now()},
 {id:'p2',kind:'delete',taskId:'t7',label:'删除「运动半小时」',source:'demo',status:'pending',createdAt:Date.now()}
 ];
 const chats=[{id:'c1',title:'调整明天的安排',messages:[{role:'user',text:'把明天的会改到后天下午三点'},{role:'assistant',text:'找到一条匹配的待办。我先把修改前后的时间列出来，等你确认。',proposalId:'p1'}]},{id:'c2',title:'复习计划',messages:[{role:'user',text:'提醒我今天下午读 Redis 笔记'},{role:'assistant',text:'已经为你准备了一项 Redis 学习计划（演示数据）。你可以在首页或日历中调整。'}]}];
 const notes=[{id:'n1',title:'Agent 评测方法笔记',category:'技术笔记',content:'记录评测集设计、工具调用正确率、结构化输出和边界用例的评判方法。',updated:td(-1)},{id:'n2',title:'Redis 面试复习',category:'学习资料',content:'持久化、缓存穿透与击穿、分布式锁、Redis Stream。',updated:td(-2)},{id:'n3',title:'本周复盘',category:'个人记录',content:'本周推进的工作、值得保持的习惯和下周要改进的地方。',updated:td(-4)}];
 return{tasks,pending,chats,notes,activity:[{text:'帮你安排了 Redis 阅读时间',at:Date.now(),ai:true},{text:'准备了一项周会改期，等待确认',at:Date.now()-60000,ai:true}]};
}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed();if(!Array.isArray(data.tasks)||!Array.isArray(data.pending)||!Array.isArray(data.chats)||!Array.isArray(data.notes))throw Error('invalid');}catch(e){data=seed()}
const UI={page:'home',calDate:new Date(today),selectedDate:isoToday,calMode:'month',taskFilter:'all',taskSearch:'',librarySearch:'',chatId:data.chats[0]?.id||null,modal:null,drawer:null,toast:null,undo:null,returnPage:'home'};
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){console.warn('浏览器存储不可用',e)}};
const taskBy=id=>data.tasks.find(t=>t.id===id);
const pendingBy=id=>data.pending.find(p=>p.id===id);
const chatsBy=id=>data.chats.find(c=>c.id===id);
const fmtDate=s=>{const d=dateOf(s);return `${d.getMonth()+1}月${d.getDate()}日 ${weekNames[d.getDay()]}`};
const fmtFull=s=>{const d=dateOf(s);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`};
const timeOf=t=>t.time||'全天';
function sortedTasks(arr){return [...arr].sort((a,b)=>(a.date+' '+(a.time||'99:99')).localeCompare(b.date+' '+(b.time||'99:99')))}
function greeting(){let hr=new Date().getHours();return hr<11?'早上好':hr<14?'中午好':hr<18?'下午好':'晚上好'}
function taskCheck(t){return `<button type="button" class="task-check ${t.status==='done'?'done':''}" data-action="toggle-task" data-id="${h(t.id)}" aria-label="${t.status==='done'?'标记未完成':'标记完成'}">${t.status==='done'?I('check',14):''}</button>`}
function catTag(t){return `<span class="tag">${h(catNames[t.category]||'其他')}</span>`}
function taskItem(t,detail=false){return `<div class="task-item ${t.status==='done'?'done':''}">${taskCheck(t)}<button type="button" class="task-main" data-action="detail" data-id="${h(t.id)}"><span class="task-name">${h(t.title)}</span>${detail?`<span class="task-desc">${h(t.note||'')} ${t.ai?' · AI 安排':''}</span>`:''}</button><div class="task-right">${t.ai?'<span class="tag ai">AI 安排</span>':''}${detail?catTag(t):''}<span class="when">${h(timeOf(t))}</span><button type="button" class="quick-edit" title="编辑任务" data-action="edit-task" data-id="${h(t.id)}">${I('edit',14)}</button></div></div>`}
function header(){const count=data.pending.filter(p=>p.status==='pending').length;const nav=[['home','首页'],['chat','对话'],['calendar','日历'],['tasks','待办'],['library','资料库'],['review','待确认']];return `<header class="topbar"><a href="#home" class="brand" aria-label="小记首页" data-action="nav" data-page="home"><span class="brand-mark">${I('spark',13)}</span>小记<span style="color:var(--blue);font-weight:450;font-size:14px;margin-left:2px">.</span></a><nav class="nav" aria-label="主导航">${nav.map(([key,name])=>`<button type="button" data-action="nav" data-page="${key}" class="${UI.page===key?'active':''}">${name}${key==='review'&&count?`<span class="count">${count}</span>`:''}</button>`).join('')}</nav><div class="top-actions"><button type="button" class="top-new" data-action="new-task">${I('plus',15)}记一笔</button><div class="avatar" title="个人空间">我</div></div></header>`}
function footer(){return `<footer class="footer"><span>小记 · 把日子安排得刚刚好</span><span>前端交互演示 · 数据仅存放在当前浏览器 · 未连接 AI / FastAPI 服务</span></footer>`}
function home(){const todays=sortedTasks(data.tasks.filter(t=>t.date===isoToday));const todo=todays.filter(t=>t.status!=='done');const all=data.tasks.filter(t=>t.status==='todo').length;const soon=sortedTasks(data.tasks.filter(t=>t.status!=='done'&&t.date>isoToday)).slice(0,4);const d=new Date();const f=`${d.getMonth()+1}月${d.getDate()}日，${weekNames[d.getDay()]}`;const nowHour=d.getHours()+d.getMinutes()/60;return `<main class="page"><section class="home-hero"><div class="date-label">${f} · ${greeting()}</div><h1 class="hero-title">想让<span class="ink-line">小记</span>做点什么？</h1><form id="homeCommand" class="command-form" data-form="home-command"><input name="command" autocomplete="off" aria-label="告诉小记你的安排" placeholder="比如：明天下午三点提醒我复习 Redis" required/><button type="submit" class="command-send" aria-label="发送给小记">${I('arrow',21)}</button></form><div class="examples"><span class="tiny">试着说</span><button type="button" class="sample" data-action="suggest" data-text="明天下午三点提醒我复习 Redis">明天下午三点提醒我复习 Redis</button><button type="button" class="sample" data-action="suggest" data-text="后天上午十点安排项目复盘">后天上午十点安排项目复盘</button></div><div class="home-metrics"><div class="metric"><strong>${String(todays.length).padStart(2,'0')}</strong>今日安排</div><div class="metric"><strong>${String(todo.length).padStart(2,'0')}</strong>今日待完成</div><div class="metric"><strong>${String(all).padStart(2,'0')}</strong>全部待办</div></div></section><div class="main-grid"><div><section><div class="section-heading"><h2 class="section-title">今天的时间轴</h2><button type="button" class="subtle-link" data-action="nav" data-page="calendar">查看日历 ${I('arrow',14)}</button></div><div class="timeline-wrap"><div class="timeline"><div class="timeline-hours">${Array.from({length:14},(_,i)=>`<span>${pad(i+8)}</span>`).join('')}</div>${nowHour>=8&&nowHour<=22?`<div class="timeline-now" style="left:${((nowHour-8)/14)*100}%"><span>现在</span></div>`:''}${todays.filter(t=>t.time&&t.status!=='done').map(t=>{const parts=t.time.split(':').map(Number),hr=parts[0]+parts[1]/60;const left=((hr-8)/14)*100;const w=Math.min(Math.max(t.duration/60/14*100,8),22);if(left<0||left>99)return'';return `<button type="button" data-action="detail" data-id="${h(t.id)}" class="slot ${t.ai?'ai':t.priority==='high'?'important':''}" style="left:${left}%;width:${w}%;"><strong>${h(t.time)}</strong>${h(t.title)}</button>`}).join('')||'<div class="timeline-empty">今天的安排还很轻松。</div>'}</div></div><div class="timeline-footnote"><span class="highlight">黄色</span> 是小记帮你安排的时间，可以随时调整。</div></section><section class="section-gap"><div class="section-heading"><h2 class="section-title">今天还没做</h2><button type="button" class="subtle-link" data-action="nav" data-page="tasks">全部待办 ${I('arrow',14)}</button></div><div class="task-list">${todo.length?todo.map(t=>taskItem(t)).join(''):`<div class="empty-state" style="padding:38px"><h3>今天的待办已经清空</h3><p>可以给自己留一点休息时间。</p></div>`}</div></section></div><aside><div class="info-panel"><div class="section-heading" style="margin-bottom:6px"><h3 class="mini-heading" style="margin:0">即将到来</h3><span class="tag blue">未来几天</span></div>${soon.length?soon.map(t=>{let d=dateOf(t.date);return `<div class="upcoming-row"><div class="date-block"><strong>${d.getDate()}</strong><span>${d.getMonth()+1}月</span></div><div class="upcoming-txt"><b>${h(t.title)}</b><small>${h(t.time||'全天')} · ${h(catNames[t.category]||'其他')}</small></div><button class="text-btn" type="button" data-action="detail" data-id="${h(t.id)}" aria-label="打开详情">${I('chevron-right',16)}</button></div>`}).join(''):'<p class="small" style="padding:12px 0">近期没有额外安排。</p>'}<button class="subtle-link" type="button" data-action="nav" data-page="calendar" style="margin-top:7px">去日历查看 ${I('arrow',13)}</button></div><div class="activity"><div class="section-heading"><h3 class="mini-heading" style="margin:0">小记刚刚做了</h3><button type="button" class="subtle-link" data-action="nav" data-page="review">审核提案</button></div>${(data.activity||[]).slice(0,3).map(x=>`<div class="activity-row"><span class="mini-ai">小记</span><b>${h(x.text)}</b></div>`).join('')||'<div class="activity-row">还没有新的动态。</div>'}</div></aside></div></main>`}
function chat(){let chat=chatsBy(UI.chatId)||data.chats[0];if(!chat){chat={id:'new',title:'新对话',messages:[]}}return `<main class="page"><div class="page-head"><div><div class="page-kicker"><span class="dot"></span> ASSISTANT</div><h1 class="page-title">和小记聊聊</h1><p class="lead">用一句话安排任务，重要修改由你确认。</p></div></div><div class="chat-layout"><aside class="chat-sidebar"><button type="button" class="chat-start" data-action="new-chat">${I('plus',17)}开启新对话</button><div class="chat-group-label">最近的对话</div>${data.chats.map(c=>`<button type="button" class="history-btn ${c.id===UI.chatId?'active':''}" data-action="chat-open" data-id="${h(c.id)}">${h(c.title)}</button>`).join('')}<div class="chat-about">小记目前处于本地演示模式。<br>可以体验任务新增、修改建议和确认流程。</div></aside><section class="chat-main"><div class="chat-bar"><span>${h(chat.title)}</span><span class="chat-badge">演示模式 · 未连接 AI</span></div><div class="chat-messages" id="chat-scroll">${chat.messages.length?chat.messages.map(m=>message(m)).join(''):`<div class="empty-state" style="margin:auto"><div class="empty-symbol">${I('message',23)}</div><h3>想到什么，就告诉小记</h3><p>试着输入“明天下午三点提醒我复习 Redis”</p></div>`}</div><div class="chat-compose"><form class="chat-input-wrap" data-form="chat"><textarea name="message" rows="2" aria-label="输入消息" placeholder="输入你想安排的事情…" required></textarea><button class="chat-send" type="submit" aria-label="发送消息">${I('up',17)}</button></form><div class="chat-hint">Enter 发送 · Shift + Enter 换行 · 演示版仅识别简单中文计划指令</div></div></section></div></main>`}
function message(m){let proposal=m.proposalId?pendingBy(m.proposalId):null;return `<div class="chat-msg ${m.role==='user'?'user':''}"><span class="msg-avatar">${m.role==='user'?'我':'✳'}</span><div class="message-body"><div class="message-name">${m.role==='user'?'你':'小记'}</div><div class="bubble">${h(m.text)}</div>${proposal?proposalHtml(proposal,true):''}</div></div>`}
function proposalHtml(p,inChat=false){const t=taskBy(p.taskId);const original=p.kind==='delete'?(t||p.deletedTask):t;const oldLabel=p.oldDate?`${fmtDate(p.oldDate)} ${p.oldTime||'全天'}`:original?`${fmtDate(original.date)} ${timeOf(original)}`:'已删除任务';const newLabel=p.kind==='update'?`${fmtDate(p.newDate)} ${p.newTime||'全天'}`:p.kind==='delete'?'将这条待办移除':`${fmtDate(p.taskData?.date||isoToday)} ${p.taskData?.time||'全天'}`;const done=p.status!=='pending';return `<div class="suggestion"><div class="diff-title">${p.kind==='delete'?'删除待办':p.kind==='create'?'准备新增待办':'修改建议'} ${!inChat?`· ${h(p.label||'')}`:''}</div><div style="font-size:13px;font-weight:650;margin-bottom:10px">${h(t?.title||p.taskData?.title||p.label||'')}</div><div class="diff-columns"><div class="diff-col"><span class="tiny">${p.kind==='create'?'当前':'修改前'}</span><b>${p.kind==='create'?'暂无计划':h(oldLabel)}</b></div><span class="diff-arrow">${I('arrow',17)}</span><div class="diff-col new"><span class="tiny">${p.kind==='delete'?'操作':'修改后'}</span><b>${h(newLabel)}</b></div></div><div class="diff-actions">${done?`<span class="tag ${p.status==='confirmed'?'green':'ghost'}">${p.status==='confirmed'?'已确认':p.status==='cancelled'?'已取消':'已处理'}</span>`:`<button type="button" class="solid ${p.kind==='delete'?'danger-outline':''}" data-action="confirm" data-id="${h(p.id)}">${p.kind==='delete'?'确认删除':p.kind==='create'?'确认添加':'确认修改'}</button><button type="button" class="outline" data-action="cancel" data-id="${h(p.id)}">保持原样</button>`}</div></div>`}
function calendar(){const d=UI.calDate,mon=d.getMonth(),yr=d.getFullYear();let start,count;if(UI.calMode==='month'){const first=new Date(yr,mon,1);start=addDays(first,-((first.getDay()+6)%7));const end=new Date(yr,mon+1,0);count=Math.ceil((((end-start)/(864e5))+1)/7)*7;}else{const active=dateOf(UI.selectedDate);start=addDays(active,-((active.getDay()+6)%7));count=7;}const tasks=sortedTasks(data.tasks);const days=Array.from({length:count},(_,idx)=>{const curr=addDays(start,idx),key=localISO(curr),dayTasks=tasks.filter(t=>t.date===key);return `<div class="day-cell ${curr.getMonth()!==mon&&UI.calMode==='month'?'dim':''} ${key===isoToday?'today':''} ${key===UI.selectedDate?'active':''}" data-action="select-day" data-date="${key}" role="button" tabindex="0" aria-label="${h(fmtDate(key))}"><div class="day-number">${curr.getDate()}</div>${dayTasks.slice(0,3).map(t=>`<button type="button" class="cal-chip ${h(t.category)}" title="${h(t.title)}" data-action="detail" data-id="${h(t.id)}">${h(t.time? t.time+' ':'')}${h(t.title)}</button>`).join('')}${dayTasks.length>3?`<span class="cal-more">还有 ${dayTasks.length-3} 项</span>`:''}</div>`}).join('');const selected=tasks.filter(t=>t.date===UI.selectedDate);let title=UI.calMode==='month'?`${yr} 年 ${mon+1} 月`:`${fmtDate(localISO(start))} — ${fmtDate(localISO(addDays(start,6)))}`;return `<main class="page"><div class="page-head"><div><div class="page-kicker"><span class="dot"></span> CALENDAR</div><h1 class="page-title">日历</h1><p class="lead">让安排变得清晰，也为临时的灵感留一点空间。</p></div><div class="head-actions"><button class="outline" type="button" data-action="cal-today">回到今天</button><button class="solid" type="button" data-action="new-task" data-date="${UI.selectedDate}">${I('plus',15)}添加日程</button></div></div><div class="calendar-toolbar"><div class="month-name">${h(title)}</div><div class="calendar-controls"><button class="square-btn" type="button" data-action="cal-prev" aria-label="上一页">${I('chevron-left',17)}</button><button class="square-btn" type="button" data-action="cal-next" aria-label="下一页">${I('chevron-right',17)}</button><div class="segmented"><button type="button" class="${UI.calMode==='month'?'on':''}" data-action="cal-mode" data-mode="month">月视图</button><button type="button" class="${UI.calMode==='week'?'on':''}" data-action="cal-mode" data-mode="week">周视图</button></div></div></div><div class="calendar-layout"><section class="calendar-board"><div class="weekdays">${['周一','周二','周三','周四','周五','周六','周日'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days-grid">${days}</div></section><aside class="selected-day"><div class="page-kicker"><span class="dot"></span> SELECTED DAY</div><h3>${h(fmtDate(UI.selectedDate))}</h3><div class="selected-week">${selected.length} 项安排 · ${selected.filter(x=>x.status==='done').length} 项已完成</div>${selected.length?selected.map(t=>`<button class="selected-task" type="button" data-action="detail" data-id="${h(t.id)}"><span class="time">${h(t.time||'全天')}</span><span class="n">${h(t.title)}<small>${h(catNames[t.category]||'其他')} ${t.status==='done'?'· 已完成':''}</small></span></button>`).join(''):'<div class="selected-empty">今天还没有安排。<br>可以放心地享受一点空白。</div>'}<button type="button" class="outline" data-action="new-task" data-date="${UI.selectedDate}" style="width:100%;margin-top:13px">${I('plus',16)}给这天加个安排</button><div class="calendar-tip"><span class="tag ai">小记建议</span><div style="margin-top:9px">安排太满的时候，可以在对话中请小记帮你调整。调整前会展示修改内容，交由你确认。</div></div></aside></div></main>`}
function tasksPage(){let list=sortedTasks(data.tasks);if(UI.taskFilter==='today')list=list.filter(t=>t.date===isoToday);if(UI.taskFilter==='upcoming')list=list.filter(t=>t.date>isoToday&&t.status!=='done');if(UI.taskFilter==='done')list=list.filter(t=>t.status==='done');if(UI.taskFilter==='todo')list=list.filter(t=>t.status==='todo');if(UI.taskFilter.startsWith('cat:'))list=list.filter(t=>t.category===UI.taskFilter.slice(4));if(UI.taskSearch)list=list.filter(t=>(t.title+' '+t.note).toLowerCase().includes(UI.taskSearch.toLowerCase()));const total=data.tasks.length,done=data.tasks.filter(t=>t.status==='done').length;return `<main class="page"><div class="page-head"><div><div class="page-kicker"><span class="dot"></span> TO-DO LIST</div><h1 class="page-title">待办清单</h1><p class="lead">不急着做完所有事，先把重要的做好。</p></div><div class="head-actions"><button class="solid" type="button" data-action="new-task">${I('plus',15)}新建待办</button></div></div><div class="main-grid"><div><div class="section-heading" style="align-items:center"><h2 class="section-title">我的计划 <span class="small" style="font-weight:450">${list.length} 项</span></h2><label class="search-box">${I('search',16)}<input name="taskSearch" data-input="task-search" value="${h(UI.taskSearch)}" placeholder="搜索待办" aria-label="搜索待办"/></label></div><div class="filters">${[['all','全部'],['today','今天'],['upcoming','即将到来'],['todo','未完成'],['done','已完成']].map(([key,name])=>`<button type="button" class="filter-btn ${UI.taskFilter===key?'active':''}" data-action="task-filter" data-filter="${key}">${name}</button>`).join('')}</div><div class="tasks-board">${list.length?list.map(t=>taskItem(t,true)).join(''):`<div class="empty-state"><div class="empty-symbol">${I('search',22)}</div><h3>没有找到对应的待办</h3><p>换个筛选条件，或新建一项吧。</p></div>`}</div></div><aside><div class="info-panel"><h3 class="mini-heading">完成进度</h3><div style="display:flex;align-items:baseline;gap:9px"><b style="font-size:36px;letter-spacing:-1px">${Math.round(done/Math.max(total,1)*100)}%</b><span class="small">${done} / ${total} 已完成</span></div><div class="progress"><span style="width:${done/Math.max(total,1)*100}%"></span></div><p class="small" style="line-height:1.8;margin:16px 0 0">每完成一件小事，都在让计划慢慢成形。</p></div><div class="activity"><h3 class="mini-heading">按类别查看</h3>${Object.entries(catNames).map(([c,title])=>`<button type="button" class="side-choice ${UI.taskFilter==='cat:'+c?'active':''}" data-action="task-filter" data-filter="cat:${c}"><span style="display:flex;gap:9px;align-items:center"><span class="pill-dot" style="background:${catColors[c]}"></span>${title}</span><span class="side-num">${data.tasks.filter(t=>t.category===c).length}</span></button>`).join('')}</div></aside></div></main>`}
function library(){const notes=data.notes.filter(n=>(n.title+' '+n.content).includes(UI.librarySearch));return `<main class="page"><div class="page-head"><div><div class="page-kicker"><span class="dot"></span> KNOWLEDGE SPACE</div><h1 class="page-title">资料库</h1><p class="lead">把有用的内容放在一起，随时回来看一看。</p></div><div class="head-actions"><button class="solid" type="button" data-action="new-note">${I('plus',15)}新建笔记</button></div></div><div class="section-heading" style="margin-bottom:24px"><h2 class="section-title">我的资料 <span class="small" style="font-weight:450">${data.notes.length} 篇</span></h2><label class="search-box">${I('search',16)}<input name="noteSearch" data-input="note-search" value="${h(UI.librarySearch)}" placeholder="搜索资料" aria-label="搜索资料"/></label></div><div class="library-grid">${notes.length?notes.map(n=>`<button class="note-card" type="button" data-action="edit-note" data-id="${h(n.id)}"><span class="tag blue">${I('book',13)} ${h(n.category)}</span><h3>${h(n.title)}</h3><p>${h(n.content)}</p><div class="note-bottom">最后更新 · ${h(n.updated)}</div></button>`).join(''):'<div class="empty-state"><h3>暂无匹配的笔记</h3></div>'}</div></main>`}
function review(){let pending=data.pending.filter(p=>p.status==='pending'),history=data.pending.filter(p=>p.status!=='pending').slice().reverse();return `<main class="page"><div class="page-head"><div><div class="page-kicker"><span class="dot"></span> REVIEW & CONFIRM</div><h1 class="page-title">待确认的修改${pending.length?` <span style="font-size:17px;color:var(--sub);font-weight:500">${pending.length} 项</span>`:''}</h1><p class="lead">小记可以替你准备操作，但最终决定权始终在你。</p></div></div><div class="review-grid"><div>${pending.length?pending.map(p=>`<section class="review-card"><div class="review-top"><span class="tag ai">待确认</span><span class="tiny">${p.source==='demo'?'示例提案':'来自对话'}</span></div><h3>${h(p.label||'待办修改')}</h3><div class="review-explain">${p.kind==='delete'?'这是一项删除操作。确认前不会移除任务。':'以下是操作前后的对比，确认后才会写入计划。'}</div>${proposalHtml(p)}</section>`).join(''):`<div class="empty-state panel"><div class="empty-symbol">${I('check',24)}</div><h3>所有修改都已处理</h3><p>有新的修改建议时，会出现在这里。</p></div>`}${history.length?`<div class="review-history"><h3 class="section-title" style="margin-bottom:18px">最近处理过的</h3>${history.map(p=>`<div class="history-row"><span class="tag ${p.status==='confirmed'?'green':'ghost'}">${p.status==='confirmed'?'已确认':'已取消'}</span><div class="history-description">${h(p.label||'计划操作')}<div class="tiny">${p.kind==='update'?'修改时间':p.kind==='delete'?'删除待办':'新建待办'}</div></div>${p.status==='confirmed'&&p.kind!=='create'?`<button class="subtle-link" type="button" data-action="undo-proposal" data-id="${h(p.id)}">撤销</button>`:''}</div>`).join('')}</div>`:''}</div><aside><div class="info-panel"><h3 class="mini-heading">先确认，再执行</h3><p class="small" style="line-height:2;margin:0">创建新任务、修改时间和删除待办，都可以先预览操作内容。<br><br>本演示仅在浏览器本地修改数据，不会向外部服务发送信息。</p><button type="button" class="outline" data-action="nav" data-page="chat" style="margin-top:18px;width:100%">去和小记对话 ${I('arrow',14)}</button></div></aside></div></main>`}
function taskModal(){let editing=UI.modal?.id?taskBy(UI.modal.id):null;let dt=UI.modal?.date||editing?.date||isoToday;return `<div class="overlay" data-action="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${editing?'编辑待办':'记一笔'}</h2><p>把想做的事写下来，剩下的慢慢安排。</p></div><button class="close-btn" type="button" data-action="close-modal" aria-label="关闭">${I('x',20)}</button></div><form data-form="task"><div class="form-group"><label class="form-label" for="taskTitle">待办名称 *</label><input id="taskTitle" class="field" type="text" name="title" maxlength="80" required placeholder="例如：完成项目复盘" value="${h(editing?.title||'')}"/></div><div class="field-row"><div class="form-group"><label class="form-label" for="taskDate">日期 *</label><input class="field" id="taskDate" type="date" name="date" value="${h(dt)}" required/></div><div class="form-group"><label class="form-label" for="taskTime">开始时间</label><input class="field" id="taskTime" type="time" name="time" value="${h(editing?.time||'14:00')}"/></div></div><div class="field-row"><div class="form-group"><label class="form-label" for="taskCat">分类</label><select id="taskCat" class="field" name="category">${Object.entries(catNames).map(([c,n])=>`<option value="${c}" ${editing?.category===c?'selected':''}>${n}</option>`).join('')}</select></div><div class="form-group"><label class="form-label" for="taskPrio">优先级</label><select id="taskPrio" class="field" name="priority"><option value="low" ${editing?.priority==='low'?'selected':''}>低</option><option value="medium" ${!editing||editing.priority==='medium'?'selected':''}>中</option><option value="high" ${editing?.priority==='high'?'selected':''}>高</option></select></div></div><div class="form-group"><label class="form-label" for="taskDur">预计用时（分钟）</label><input id="taskDur" class="field" name="duration" type="number" min="5" max="720" step="5" value="${editing?.duration||45}"/></div><div class="form-group"><label class="form-label" for="taskNote">备注</label><textarea class="field fieldarea" id="taskNote" name="note" placeholder="写点备注，方便以后想起来…">${h(editing?.note||'')}</textarea></div><div class="modal-actions"><button type="button" class="outline" data-action="close-modal">取消</button><button type="submit" class="solid">${editing?'保存修改':'添加待办'}</button></div></form></section></div>`}
function noteModal(){let n=UI.modal?.id?data.notes.find(x=>x.id===UI.modal.id):null;return `<div class="overlay" data-action="overlay"><section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${n?'编辑资料':'写一篇笔记'}</h2><p>简单记录，日后好找。</p></div><button class="close-btn" type="button" data-action="close-modal" aria-label="关闭">${I('x',20)}</button></div><form data-form="note"><div class="form-group"><label class="form-label" for="noteTitle">标题 *</label><input id="noteTitle" class="field" name="title" required maxlength="100" value="${h(n?.title||'')}" placeholder="给这份笔记起个标题"/></div><div class="form-group"><label class="form-label" for="noteCategory">分类</label><input id="noteCategory" class="field" name="category" maxlength="30" value="${h(n?.category||'个人记录')}"/></div><div class="form-group"><label class="form-label" for="noteContent">内容</label><textarea class="field fieldarea" style="min-height:220px" id="noteContent" name="content" placeholder="今天有哪些值得记录的内容？">${h(n?.content||'')}</textarea></div><div class="modal-actions">${n?`<button class="text-btn danger" type="button" data-action="delete-note" data-id="${h(n.id)}" style="margin-right:auto">${I('trash',14)}删除笔记</button>`:''}<button type="button" class="outline" data-action="close-modal">取消</button><button type="submit" class="solid">保存笔记</button></div></form></section></div>`}
function drawer(){const t=taskBy(UI.drawer);if(!t)return'';const sub=t.subtasks||[];return `<div class="drawer-overlay" data-action="close-drawer"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-head"><span class="tiny">待办详情 / ${h(catNames[t.category]||'其他')}</span><button class="close-btn" data-action="close-drawer" type="button" aria-label="关闭">${I('x',20)}</button></div><span class="tag ${t.status==='done'?'green':t.priority==='high'?'red':'blue'}">${t.status==='done'?'已完成':t.priority==='high'?'高优先级':'进行中'}</span>${t.ai?'<span class="tag ai" style="margin-left:7px">AI 安排</span>':''}<h2 id="drawer-title">${h(t.title)}</h2><div class="meta-line">${I('calendar',15)} ${h(fmtFull(t.date))} · ${h(weekNames[dateOf(t.date).getDay()])}</div><div class="meta-line">${I('clock',15)} ${h(t.time||'全天')} 开始 · 预计 ${h(t.duration)} 分钟</div><div class="detail-actions"><button class="solid" type="button" data-action="toggle-task" data-id="${h(t.id)}">${I('check',16)} ${t.status==='done'?'标记未完成':'标记完成'}</button><button class="outline" type="button" data-action="edit-task" data-id="${h(t.id)}">${I('edit',15)} 编辑</button><button class="text-btn danger" type="button" data-action="delete-task" data-id="${h(t.id)}">${I('trash',15)} 删除</button></div><div class="detail-section"><h3 class="subheading">任务描述</h3><p class="small" style="line-height:2;white-space:pre-wrap">${h(t.note||'还没有添加备注。')}</p></div><div class="detail-section"><h3 class="subheading">子任务 <span class="tiny">${sub.filter(s=>s.done).length} / ${sub.length}</span></h3>${sub.length?sub.map((s,i)=>`<div class="subtask-row"><button class="task-check ${s.done?'done':''}" data-action="toggle-sub" data-id="${h(t.id)}" data-index="${i}" type="button">${s.done?I('check',13):''}</button>${h(s.title)}</div>`).join(''):'<p class="small">拆分成几个小步骤，会更容易开始。</p>'}<form data-form="subtask" data-id="${h(t.id)}" style="display:flex;gap:7px;margin-top:13px"><input class="field" name="title" placeholder="添加一个子任务" required maxlength="90"/><button class="outline" type="submit" aria-label="添加子任务">${I('plus',17)}</button></form></div><div class="detail-section"><h3 class="subheading">关于这条待办</h3><div class="meta-line">分类 · ${h(catNames[t.category]||'其他')}</div><div class="meta-line">优先级 · ${t.priority==='high'?'高':t.priority==='medium'?'中':'低'}</div><div class="meta-line">创建方式 · ${t.ai?'小记建议':'手动添加'}</div></div></section></div>`}
function render(){const root=document.querySelector('#app');if(!root)return;const pages={home,chat,calendar,tasks:tasksPage,library,review};root.innerHTML=`<div class="shell">${header()}${(pages[UI.page]||home)()}${footer()}</div>${UI.modal?(UI.modal.type==='task'?taskModal():noteModal()):''}${UI.drawer?drawer():''}${UI.toast?`<div class="toast" role="status"><span>${h(UI.toast.text)}</span>${UI.toast.undo?`<button data-action="undo" type="button">撤销</button>`:`<button data-action="hide-toast" type="button" aria-label="关闭">${I('x',15)}</button>`}</div>`:''}`;if(UI.page==='chat'){const el=document.getElementById('chat-scroll');if(el)el.scrollTop=el.scrollHeight}}
function notify(text,undo){UI.toast={text,undo:!!undo};render()}
function addActivity(txt){data.activity=[{text:txt,at:Date.now(),ai:true},...(data.activity||[])].slice(0,8)}
function createPending(p){p.id='p'+Math.random().toString(36).slice(2,9);p.status='pending';p.createdAt=Date.now();p.source='chat';data.pending.unshift(p);return p.id}
function chineseNumber(value){
 if(/^\d+$/.test(value))return Number(value);
 const m={'零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
 if(value==='十')return 10;
 if(value.includes('十')){const [left,right]=value.split('十');return (left?m[left]:1)*10+(right?m[right]:0)}
 return value.length===1?m[value]:NaN;
}
function parseDate(text){
 let date=new Date(today);
 if(text.includes('大后天'))date=addDays(today,3);
 else if(text.includes('后天'))date=addDays(today,2);
 else if(text.includes('明天'))date=addDays(today,1);
 else if(/下周[一二三四五六日天]/.test(text)){
  const letter=text.match(/下周([一二三四五六日天])/)[1];
  const target=['一','二','三','四','五','六','日','天'].indexOf(letter);
  const weekday=(today.getDay()+6)%7;
  date=addDays(today,7-weekday+(target>=6?6:target));
 }
 const dm=text.match(/(\d{1,2})月(\d{1,2})日?/);
 if(dm){date=new Date(today.getFullYear(),Number(dm[1])-1,Number(dm[2]));if(date<today)date.setFullYear(date.getFullYear()+1)}
 let time='14:00';
 const tm=text.match(/(上午|早上|早晨|中午|下午|晚上|晚间)?\s*([零〇一二两三四五六七八九十\d]{1,3})\s*(点|时|[:：])\s*([零〇一二两三四五六七八九十\d]{1,3}|半)?\s*分?/);
 if(tm){
  let hour=chineseNumber(tm[2]);
  let minute=tm[4]==='半'?30:tm[4]?chineseNumber(tm[4]):0;
  if(Number.isFinite(hour)&&Number.isFinite(minute)&&hour<=23&&minute<=59){
   if(['下午','晚上','晚间'].includes(tm[1])&&hour<12)hour+=12;
   if(tm[1]==='中午'&&hour<11)hour+=12;
   if(['上午','早上','早晨'].includes(tm[1])&&hour===12)hour=0;
   time=`${pad(hour)}:${pad(minute)}`;
  }
 }
 return {date:localISO(date),time};
}
function findReferencedTask(text){const list=sortedTasks(data.tasks).filter(t=>t.status!=='done');let match=list.find(t=>text.includes(t.title));if(match)return match;return list.find(t=>t.title.split(/\s+/).some(w=>w.length>=2&&text.includes(w)))||null}
function inferTitle(text){
 let s=text.replace(/(上午|早上|早晨|中午|下午|晚上|晚间)?\s*[零〇一二两三四五六七八九十\d]{1,3}\s*[点时:：]\s*([零〇一二两三四五六七八九十\d]{1,3}|半)?\s*分?/g,'');
 s=s.replace(/(请|帮我|记得|提醒我|帮忙|安排|添加|新建|创建|一个|一项|待办|任务|在|到|于|大后天|后天|明天|今天|下周[一二三四五六日天]|\d{1,2}月\d{1,2}日|的时候|一下|，|。)/g,'').trim();
 return s.slice(0,55)||'新计划';
}
function processMessage(text){if(!data.chats.length){const c={id:'c'+Date.now(),title:text.slice(0,18),messages:[]};data.chats.unshift(c);UI.chatId=c.id}let c=chatsBy(UI.chatId);if(!c){c={id:'c'+Date.now(),title:text.slice(0,18),messages:[]};data.chats.unshift(c);UI.chatId=c.id}if(c.messages.length===0)c.title=text.slice(0,22);c.messages.push({role:'user',text});let answer='',proposalId=null;const when=parseDate(text);
 if(/删除|取消(?!修改)|移除/.test(text)){const t=findReferencedTask(text);if(t){proposalId=createPending({kind:'delete',taskId:t.id,label:'删除「'+t.title+'」'});answer='找到这条待办。我已准备好删除操作，确认后才会生效。'}else answer='我还不能准确定位你要删除哪一项。可以在待办列表中点开对应任务进行删除。'}
 else if(/改到|改成|推迟|提前|调整/.test(text)){const t=findReferencedTask(text);if(t){proposalId=createPending({kind:'update',taskId:t.id,newDate:when.date,newTime:when.time,label:'调整「'+t.title+'」时间'});answer='找到一条匹配的待办。改之前先给你看看变化：'}else answer='我还没找到明确匹配的待办。请在指令中包含任务名称，例如「把产品周会改到后天下午三点」。'}
 else if(/提醒|复习|安排|添加|创建|新建|记录|学习|完成|准备/.test(text)){const title=inferTitle(text);proposalId=createPending({kind:'create',taskData:{title,date:when.date,time:when.time,duration:45,category:/学习|复习|Redis|神经|笔记/.test(text)?'study':'job',priority:'medium',note:'来自本地演示对话：'+text,status:'todo',ai:true,subtasks:[]},label:'新增「'+title+'」'});answer='我整理了一条待办建议。请检查标题和时间，确认后会加入计划。';}
 else answer='我收到了这句话。当前是本地前端演示，尚未接入真正的 AI Agent。你可以试试「明天下午三点提醒我复习 Redis」，或使用右上角「记一笔」手动添加。';
 c.messages.push({role:'assistant',text:answer,proposalId});if(proposalId)addActivity('准备了一个操作建议，等待你确认');store();UI.page='chat';render()}
function confirmProposal(id){const p=pendingBy(id);if(!p||p.status!=='pending')return;const before=JSON.parse(JSON.stringify(data.tasks));const t=taskBy(p.taskId);if(p.kind==='create'){const created={...p.taskData,id:'t'+Math.random().toString(36).slice(2,10)};data.tasks.push(created);p.createdId=created.id;}else if(p.kind==='update'&&t){p.oldDate=t.date;p.oldTime=t.time;t.date=p.newDate;t.time=p.newTime;}else if(p.kind==='delete'&&t){p.deletedTask=JSON.parse(JSON.stringify(t));data.tasks=data.tasks.filter(x=>x.id!==t.id);}else{notify('任务已不存在，无法执行');return}p.status='confirmed';p.before=before;addActivity(p.kind==='delete'?'删除了一条已确认的待办':p.kind==='create'?'根据你的确认新增了一条待办':'根据你的确认调整了待办时间');store();notify('已确认，计划已更新')}
function cancelProposal(id){const p=pendingBy(id);if(!p||p.status!=='pending')return;p.status='cancelled';store();notify('已取消修改，原计划保持不变')}
function undoProposal(id){const p=pendingBy(id);if(!p||p.status!=='confirmed')return; if(p.kind==='update'){const t=taskBy(p.taskId);if(t){t.date=p.oldDate;t.time=p.oldTime}}else if(p.kind==='delete'&&p.deletedTask&&!taskBy(p.deletedTask.id)){data.tasks.push(p.deletedTask)}else if(p.kind==='create')data.tasks=data.tasks.filter(t=>t.id!==p.createdId);p.status='cancelled';store();notify('已撤销该操作')}
function closeOverlay(){UI.modal=null;UI.drawer=null;render()}
function deleteTask(id){let task=taskBy(id);if(!task)return;const copy=JSON.parse(JSON.stringify(task));data.tasks=data.tasks.filter(t=>t.id!==id);UI.drawer=null;UI.undo={type:'delete',task:copy};store();notify('「'+task.title+'」已删除',true)}
function toggleTask(id){const t=taskBy(id);if(!t)return;t.status=t.status==='done'?'todo':'done';store();notify(t.status==='done'?'已完成「'+t.title+'」':'已恢复「'+t.title+'」')}
function navigate(page){UI.page=page;UI.drawer=null;UI.modal=null;render();window.scrollTo?.({top:0,behavior:'smooth'})}
function handleClick(e){const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,id=btn.dataset.id;if(a==='overlay'&&e.target!==btn)return;if(a==='close-drawer'&&e.target!==btn&&btn.classList.contains('drawer-overlay'))return;if(a==='nav'){e.preventDefault();navigate(btn.dataset.page);return}if(a==='new-task'){UI.modal={type:'task',date:btn.dataset.date||UI.selectedDate};render();document.getElementById('taskTitle')?.focus();return}if(a==='edit-task'){UI.modal={type:'task',id};UI.drawer=null;render();return}if(a==='new-note'){UI.modal={type:'note'};render();return}if(a==='edit-note'){UI.modal={type:'note',id};render();return}if(a==='delete-note'){data.notes=data.notes.filter(n=>n.id!==id);UI.modal=null;store();notify('笔记已删除');return}if(a==='close-modal'||a==='overlay'||a==='close-drawer'){closeOverlay();return}if(a==='detail'){UI.drawer=id;render();return}if(a==='toggle-task'){toggleTask(id);return}if(a==='toggle-sub'){const t=taskBy(id);let s=t?.subtasks?.[+btn.dataset.index];if(s){s.done=!s.done;store();render()}return}if(a==='delete-task'){deleteTask(id);return}if(a==='task-filter'){UI.taskFilter=btn.dataset.filter;render();return}if(a==='cal-today'){UI.selectedDate=isoToday;UI.calDate=new Date(today);render();return}if(a==='cal-prev'||a==='cal-next'){let sign=a==='cal-next'?1:-1;if(UI.calMode==='month'){UI.calDate=new Date(UI.calDate.getFullYear(),UI.calDate.getMonth()+sign,1);UI.selectedDate=localISO(UI.calDate)}else{UI.selectedDate=localISO(addDays(dateOf(UI.selectedDate),7*sign));UI.calDate=dateOf(UI.selectedDate)}render();return}if(a==='cal-mode'){UI.calMode=btn.dataset.mode;UI.calDate=dateOf(UI.selectedDate);render();return}if(a==='select-day'){UI.selectedDate=btn.dataset.date;UI.calDate=dateOf(btn.dataset.date);render();return}if(a==='suggest'){UI.page='chat';if(!data.chats.length){const c={id:'c'+Date.now(),title:'新对话',messages:[]};data.chats.unshift(c);UI.chatId=c.id}else{const c={id:'c'+Date.now(),title:'新对话',messages:[]};data.chats.unshift(c);UI.chatId=c.id}processMessage(btn.dataset.text);return}if(a==='chat-open'){UI.chatId=id;render();return}if(a==='new-chat'){const c={id:'c'+Date.now(),title:'新对话',messages:[]};data.chats.unshift(c);UI.chatId=c.id;store();render();return}if(a==='confirm'){confirmProposal(id);return}if(a==='cancel'){cancelProposal(id);return}if(a==='undo-proposal'){undoProposal(id);return}if(a==='undo'){if(UI.undo?.type==='delete'&&!taskBy(UI.undo.task.id)){data.tasks.push(UI.undo.task);store()}UI.undo=null;notify('已撤销删除');return}if(a==='hide-toast'){UI.toast=null;render();return}}
function handleSubmit(e){const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const fd=new FormData(form),kind=form.dataset.form;if(kind==='home-command'){const text=String(fd.get('command')||'').trim();if(text){let c={id:'c'+Date.now(),title:text.slice(0,19),messages:[]};data.chats.unshift(c);UI.chatId=c.id;processMessage(text)}return}if(kind==='chat'){const text=String(fd.get('message')||'').trim();if(text)processMessage(text);return}if(kind==='task'){const title=String(fd.get('title')||'').trim(),date=String(fd.get('date')||'');if(!title||!date)return;let existing=UI.modal?.id?taskBy(UI.modal.id):null;const t={title,date,time:String(fd.get('time')||''),duration:Math.max(5,Math.min(720,+fd.get('duration')||45)),category:String(fd.get('category')||'other'),priority:String(fd.get('priority')||'medium'),note:String(fd.get('note')||''),status:existing?.status||'todo',ai:existing?.ai||false,subtasks:existing?.subtasks||[]};if(existing)Object.assign(existing,t);else data.tasks.push({...t,id:'t'+Math.random().toString(36).slice(2,10)});UI.modal=null;store();notify(existing?'修改已保存':'待办已添加');return}if(kind==='note'){const title=String(fd.get('title')||'').trim();if(!title)return;let existing=UI.modal?.id?data.notes.find(n=>n.id===UI.modal.id):null;const n={title,category:String(fd.get('category')||'个人记录'),content:String(fd.get('content')||''),updated:localISO(new Date())};if(existing)Object.assign(existing,n);else data.notes.unshift({...n,id:'n'+Date.now()});UI.modal=null;store();notify('笔记已保存');return}if(kind==='subtask'){const t=taskBy(form.dataset.id),title=String(fd.get('title')||'').trim();if(t&&title){t.subtasks=(t.subtasks||[]);t.subtasks.push({title,done:false});store();render()}return}}
function handleInput(e){if(e.target.dataset.input==='task-search'){let v=e.target.value,cur=e.target.selectionStart;UI.taskSearch=v;render();const el=document.querySelector('[data-input="task-search"]');if(el){el.focus();el.setSelectionRange(cur,cur)}}if(e.target.dataset.input==='note-search'){let v=e.target.value,cur=e.target.selectionStart;UI.librarySearch=v;render();const el=document.querySelector('[data-input="note-search"]');if(el){el.focus();el.setSelectionRange(cur,cur)}}}
function handleKey(e){if(e.key==='Escape'&&(UI.modal||UI.drawer)){closeOverlay();return}if(e.key==='Enter'&&!e.shiftKey&&e.target.matches('.chat-input-wrap textarea')){e.preventDefault();e.target.closest('form').requestSubmit()}if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('day-cell')){e.preventDefault();UI.selectedDate=e.target.dataset.date;UI.calDate=dateOf(UI.selectedDate);render()}}
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('input',handleInput);document.addEventListener('keydown',handleKey);render();
})();
</script>
